{% extends 'marketing/_shell.html' %}
{% block title %}Create your account — ProductSync{% endblock %}
{% block content %}
<section class="bg-gray-50">
  <div class="flex flex-col items-center justify-center px-4 py-10 mx-auto md:py-16">
    <div class="w-full bg-white rounded-lg shadow border border-gray-200 sm:max-w-md">
      <div class="p-6 space-y-5 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl">
          Create your free account
        </h1>
        <p class="text-sm text-gray-500">No credit card. Free during beta.</p>

        <form method="POST" class="space-y-4">
          <div>
            <label for="name" class="block mb-1.5 text-sm font-medium text-gray-900">Your name</label>
            <input type="text" name="name" id="name" required value="{{ form.name }}"
                   placeholder="Mattias Olsson"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
          </div>
          <div>
            <label for="email" class="block mb-1.5 text-sm font-medium text-gray-900">Work email</label>
            <input type="email" name="email" id="email" required value="{{ form.email }}"
                   placeholder="name@company.com"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
          </div>
          <div>
            <label for="company" class="block mb-1.5 text-sm font-medium text-gray-900">
              Company / workspace name <span class="text-gray-400 font-normal">(optional)</span>
            </label>
            <input type="text" name="company" id="company" value="{{ form.company }}"
                   placeholder="Happy Digital AB"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
          </div>
          <div>
            <label for="password" class="block mb-1.5 text-sm font-medium text-gray-900">Password</label>
            <input type="password" name="password" id="password" required minlength="8"
                   placeholder="••••••••"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
            <p class="mt-1 text-xs text-gray-500">At least 8 characters.</p>
          </div>
          <div>
            <label for="password_confirm" class="block mb-1.5 text-sm font-medium text-gray-900">Confirm password</label>
            <input type="password" name="password_confirm" id="password_confirm" required minlength="8"
                   placeholder="••••••••"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
          </div>
          <div class="flex items-start">
            <div class="flex items-center h-5">
              <input id="terms" name="terms" type="checkbox" required
                     class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300" />
            </div>
            <label for="terms" class="ml-2 text-sm font-light text-gray-600">
              I accept the <a href="#" class="font-medium text-primary-700 hover:underline">terms</a> and
              <a href="#" class="font-medium text-primary-700 hover:underline">privacy policy</a>.
            </label>
          </div>
          <button type="submit"
                  class="w-full text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
            Create account
          </button>
          <p class="text-sm font-light text-gray-500">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" class="font-medium text-primary-700 hover:underline">Sign in</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
