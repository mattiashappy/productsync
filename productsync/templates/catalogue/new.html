{% extends 'base.html' %}
{% block title %}New product — ProductSync{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
  <div class="mb-6">
    <a href="{{ url_for('catalogue.index') }}" class="inline-flex items-center text-xs text-gray-500 hover:text-gray-900 mb-2">
      <svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 14 10"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5H1m0 0 4 4M1 5l4-4"/></svg>
      All products
    </a>
    <h1 class="text-2xl font-bold text-gray-900">New product</h1>
    <p class="text-sm text-gray-500 mt-1">You can add variants and images after creating it.</p>
  </div>

  <form method="POST" class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 space-y-5">
    <div>
      <label class="block mb-1.5 text-xs font-medium text-gray-700">Title <span class="text-red-500">*</span></label>
      <input type="text" name="title" required
             class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
    </div>
    <div>
      <label class="block mb-1.5 text-xs font-medium text-gray-700">SKU <span class="text-red-500">*</span> <span class="font-normal text-gray-400">— used to match across channels</span></label>
      <input type="text" name="sku" required
             class="bg-gray-50 border border-gray-300 text-gray-900 text-sm font-mono rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="block mb-1.5 text-xs font-medium text-gray-700">Price</label>
        <input type="number" step="0.01" name="price"
               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
      </div>
      <div>
        <label class="block mb-1.5 text-xs font-medium text-gray-700">Currency</label>
        <input type="text" name="currency" value="SEK" maxlength="3"
               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
      </div>
      <div>
        <label class="block mb-1.5 text-xs font-medium text-gray-700">Stock</label>
        <input type="number" name="inventory_quantity" value="0"
               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" />
      </div>
    </div>
    <div>
      <label class="block mb-1.5 text-xs font-medium text-gray-700">Status</label>
      <select name="status"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5">
        {% for s in PRODUCT_STATUSES %}<option value="{{ s }}" {% if s == 'draft' %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block mb-1.5 text-xs font-medium text-gray-700">Description</label>
      <textarea name="description" rows="6"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5"></textarea>
    </div>
    <div class="flex justify-between items-center pt-2 border-t border-gray-100">
      <a href="{{ url_for('catalogue.index') }}" class="text-sm text-gray-600 hover:text-gray-900">Cancel</a>
      <button type="submit"
              class="text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5">
        Create product
      </button>
    </div>
  </form>
</div>
{% endblock %}
